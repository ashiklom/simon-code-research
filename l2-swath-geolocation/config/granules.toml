# Main scene set: 2023-06-03 (DOY 154), Sacramento Valley, California.
# Chosen because a near-cloud-free daytime ECOSTRESS scene (13:25 PDT) overlaps same-day
# Aqua/Terra MODIS and SNPP/NOAA-20 VIIRS passes, giving near-nadir and swath-edge views of
# the same target. The MODIS swath-edge case is Aqua one day earlier (no same-day edge pass).
# View zenith at the single-site target is noted for each scene.
#
# Each scene = a list of consecutive granules that are stacked along-track (targets near
# granule boundaries). "geo" and "l2" lists are paired element-wise.

[scenes.modis_aqua_nadir]          # VZA ~10 deg
sensor = "modis"
geo = ["https://data.laadsdaac.earthdatacloud.nasa.gov/prod-lads/MYD03/MYD03.A2023154.2120.061.2023155150843.hdf",
       "https://data.laadsdaac.earthdatacloud.nasa.gov/prod-lads/MYD03/MYD03.A2023154.2125.061.2023155150831.hdf"]
l2  = ["https://data.lpdaac.earthdatacloud.nasa.gov/lp-prod-protected/MYD11_L2.061/MYD11_L2.A2023154.2120.061.2023155165509/MYD11_L2.A2023154.2120.061.2023155165509.hdf",
       "https://data.lpdaac.earthdatacloud.nasa.gov/lp-prod-protected/MYD11_L2.061/MYD11_L2.A2023154.2125.061.2023155175206/MYD11_L2.A2023154.2125.061.2023155175206.hdf"]

