[[finding]]
id = "lambda-guest-http"
title = "In-Lambda HTTP reaches only AWS-shaped hosts in-process; boto3 is a stand-in"
category = "Lambda"
severity = "moderate"
emulator_only = true
status = "partial"
aws = "Functions have outbound network access (subject to VPC config) and the real boto3."
emulator = "urllib requests are delivered in-process only to AWS-style hostnames (signed with the execution role); the in-Lambda boto3 has clients for a fixed list (s3, rds-data, secretsmanager, dynamodb, sqs, ...) but not cognito-idp. Calling Cognito InitiateAuth via urllib to cognito-idp.us-east-1.amazonaws.com works; GET of the pool's JWKS URL returns 400 (still on 1.0.336)."
workaround = "Token service calls Cognito with urllib; the authorizer gets the JWKS at deploy time (http data source -> JWKS_JSON) when it can't fetch it."
infra_switch = "infra/main.tf: data.http.jwks + JWKS_JSON (emulator only)"
evidence = ["e2e:token_minting", "source:services/service-com-amazonaws-lambda-awsgirapiservice/src/state/execution/guest_http.rs"]
