[[finding]]
id = "apigwv2-jwt-no-signature-check"
title = "HTTP API (v2) JWT authorizer accepts tokens with forged signatures"
category = "API Gateway"
severity = "major"
emulator_only = true
status = "gap"
aws = "The JWT authorizer verifies the signature against the issuer's JWKS (OIDC discovery) before checking iss/aud/exp/scopes."
emulator = "Checks shape, alg != none, iss, aud/client_id, exp/nbf and scopes, but not the signature: a token with an edited payload (username -> mallory) and a token signed by an unrelated key both get 200. Unchanged on 1.0.336, even though the related upstream issue file moved to things-that-now-work."
workaround = "Not used in this design (REST API + Lambda authorizer that verifies signatures). Never treat emulator results as evidence of v2 JWT security."
evidence = ["probe:apigwv2-jwt"]
crates = ["services/service-com-amazonaws-apigatewayv2-apigatewayv2/src/service/jwt.rs"]
issues = ["20261107T193731Z-apigatewayv2-cognito-idp-lambda-a-jwt-authorizer-route.md"]
