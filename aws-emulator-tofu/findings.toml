# Findings registry: every observed difference between aws-emulator (+ OpenTofu's AWS provider)
# and real AWS, plus notable things that DO work. Source of truth for report/differences.qmd,
# report tables and scripts/update_check.py (see UPDATE.md).
#
# Fields
#   id, title           stable id (referenced from infra/ comments, probes/*/check.py) and short title
#   category            section on the differences page
#   severity            major | moderate | minor | info
#   emulator_only       true  = only on aws-emulator; false = also true on real AWS (a design gotcha)
#   status              gap | partial | works   (as observed on last_verified_version)
#   aws                 what real AWS does
#   emulator            what aws-emulator did
#   workaround          what this experiment did about it (or "none needed")
#   infra_switch        optional: the variable/setting in infra/ that implements the workaround
#   evidence            probe:<name> | e2e:<route/check> | deploy:<field> | unit:<test> | source:<path>
#   crates, issues      aws-emulator repo paths / issue file names whose change should trigger a re-test
#   last_verified_version

# ------------------------------------------------------------------------------------- Lambda
[[finding]]
id = "lambda-rustpython"
title = "Python Lambdas run on RustPython (in-process), not CPython"
category = "Lambda"
severity = "major"
emulator_only = true
status = "gap"
aws = "python3.x runtimes are CPython in a Firecracker microVM: native extensions (numpy, GDAL, pydantic-core, cryptography), sockets, asyncio, /tmp, subprocesses all work."
emulator = "Handlers run inside the emulator process on RustPython 0.6 (sys.implementation.name == 'rustpython', reporting version 3.14.0 alpha for both python3.12 and python3.13). Only .py files load (compiled .so are skipped), C modules are an allow-list (no _socket, _ssl, select, _asyncio, _ctypes), and there is no host filesystem or network. Real titiler and real tipg cannot import."
workaround = "Pure-Python stand-ins (titiler-lite, tipg-lite) with titiler/tipg-compatible API surface; JWT verification written in pure Python; Data API (HTTPS) instead of a Postgres driver."
evidence = ["probe:lambda-runtimes", "probe:real-tipg-zip", "source:services/service-com-amazonaws-lambda-awsgirapiservice/src/state/execution/python.rs"]
crates = ["services/service-com-amazonaws-lambda-awsgirapiservice/src/state/execution", "vendor/engine/src/lib.rs"]
issues = ["20261107T091747Z-lambda-the-execution-environment-has-no-filesystem-or.md"]
last_verified_version = "1.0.336"

