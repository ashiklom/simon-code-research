[[finding]]
id = "rds-describeglobalclusters-filter"
title = "aws_rds_cluster cannot be created: DescribeGlobalClusters rejects the provider's filter"
category = "OpenTofu provider x emulator"
severity = "major"
emulator_only = true
status = "gap"
aws = "AWS documents only a `region` filter but accepts `db-cluster-id`, which the AWS provider uses on every read of a provisioned/global cluster."
emulator = "InvalidParameterValue: unrecognized filter name: db-cluster-id. The cluster is created, then the provider errors and taints it; every later refresh (plan, destroy) fails the same way, so `aws_rds_cluster` (provisioned engine mode) can't be managed at all and the cluster is orphaned."
workaround = "Escape hatch: terraform_data runs scripts/rds_cluster.py (boto3) and the aws_rds_cluster data source (which doesn't make the call) reads it back."
infra_switch = "infra/modules/database: via_script = var.emulator"
evidence = ["probe:rds-cluster-native"]
