[[finding]]
id = "cloudfront-authorization-dropped"
title = "CloudFront never forwards the Authorization header"
category = "CloudFront"
severity = "major"
emulator_only = true
status = "gap"
aws = "Authorization is forwarded when it is part of the cache policy's cache key (an origin request policy alone can't forward it; that part is also true on AWS)."
emulator = "Dropped regardless of cache/origin request policy: every authenticated call through CloudFront with Authorization gets 401 (30/60 e2e mismatches); other whitelisted headers (X-Auth-Token, X-Custom) are forwarded."
workaround = "Authorizer also reads X-Auth-Token; clients send the token there when going through CloudFront on the emulator. With it: 60/60."
