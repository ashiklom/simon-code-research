[tools]
python = "3.13"
uv = "0.11"
node = "22"

[env]
ICECHUNK_LOG = "error"
UV_PYTHON_DOWNLOADS = "automatic"

[tasks.sites]
description = "Build site tables (results/sites/*.csv)"
run = "uv run cpc sites"

[tasks.obs]
description = "Ingest station observations into the store"
run = "uv run cpc obs --sites uscrn"

[tasks.extract]
description = "Extract products at sites: mise run extract -- <product...> --sites pilot|uscrn|tier2|remote|all"
run = "uv run cpc extract"

[tasks.update]
description = "Bring every product (and USCRN) up to its latest available time; --dry-run to preview"
run = "uv run cpc update"

[tasks.store-copy]
description = "Copy the store between backends: mise run store-copy -- <src-root> <dst-root>"
run = "uv run cpc store-copy"

[tasks.test]
run = "uv run pytest -q"

[tasks.lags]
description = "Timestamp/day-window lag check (writes results/day_window_overrides_<sites>.csv)"
run = "uv run cpc lags --sites uscrn"

[tasks.metrics]
description = "Skill metrics for all sites with observations"
run = ["uv run cpc metrics --sites all", "uv run cpc merge-metrics"]

[tasks.figures]
run = "uv run cpc figures"

[tasks.storage]
description = "Storage-volume estimates per product (results/storage_estimates.csv, site/src/storage.json); add -- --measure to re-measure full-grid compression"
run = "uv run cpc storage"

[tasks.sitedata]
description = "Export per-site website data to site/public/data"
run = "uv run cpc sitedata --sites all --metrics all"

[tasks.pack-site]
description = "Pack site/public/data into site/site-data.tar (optional; the site reads data from the assets repo)"
run = "tar -cf site/site-data.tar -C site/public data"

[tasks.site]
description = "Build the static site into _site (from site/site-data.tar if present, else site/public/data)"
dir = "site"
run = [
  "if [ -f site-data.tar ]; then rm -rf public/data && mkdir -p public && tar -xf site-data.tar -C public; fi",
  "npm ci --no-audit --no-fund",
  "npx vite build",
]

[tasks.all]
description = "Everything after the one-off site tables: obs, extraction, metrics, figures, site data, site"
run = [
  "uv run cpc obs --sites all",
  "uv run cpc update",
  "mise run lags",
  "mise run metrics",
  "mise run figures",
  "mise run storage",
  "mise run sitedata",
  "mise run pack-site",
  "mise run site",
]

[tasks.emulator-check]
description = "Test s3:// and https:// (CloudFront) store backends against a running AWS Emulator (see results/emulator_check.md)"
run = ["uv run --with boto3 python scripts/emulator_check.py --port 9297", "uv run --with boto3 python scripts/emulator_http_noauth.py --port 9298"]
