# Builds the static site from the release asset (no analysis is re-run).
build = "mise install && mise run site"
output = "_site"

models = ["claude-opus-5-5"]
tools = ["python", "uv", "icechunk", "zarr", "xarray", "pcodec", "rasterio", "h5py", "vite", "leaflet", "uplot", "hyparquet"]

# Per-site Parquet/JSON for the website (made by `mise run sitedata && mise run pack-site`)
[[assets]]
name = "site-data.tar"
dest = "site/site-data.tar"
