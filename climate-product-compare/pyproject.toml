[project]
name = "cpc"
version = "0.1.0"
description = "climate-product-compare: gridded weather/climate products vs station observations"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiohttp>=3.10",
    "earthaccess>=0.19",
    "fsspec>=2025.9",
    "h5netcdf>=1.6",
    "h5py>=3.14",
    "icechunk>=2.3",
    "matplotlib>=3.10",
    "netcdf4>=1.7",
    "numcodecs[pcodec]>=0.17",
    "numpy>=2.2",
    "pandas>=2.3",
    "pyarrow>=21",
    "pyhdf>=0.11.7",
    "pyproj>=3.7",
    "rasterio>=1.4",
    "requests>=2.32",
    "s3fs>=2025.9",
    "scipy>=1.16",
    "xarray>=2026.9",
    "zarr>=3.4",
]

[project.scripts]
cpc = "cpc.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cpc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
