# Builds the site from committed outputs + release assets and deploys to GitHub Pages.
# Experiments are never re-run here; see _helpers/build_site.py and CLAUDE.md.
name: Deploy site

on:
  push:
    branches: [main]
  release:
    types: [published, edited]  # re-deploy when release assets change
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout + `gh release download`
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # full history for per-experiment "last updated" dates
          persist-credentials: false

      # Experiments install their own tools (python, R, quarto, pixi, ...) via mise in their build.
      # Caches are off: this workflow publishes, so don't trust state from other runs.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b  # v5.2.7
        with:
          install: false
          cache: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false

      - name: Build site
        run: uv run --locked _helpers/build_site.py --out _site
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
