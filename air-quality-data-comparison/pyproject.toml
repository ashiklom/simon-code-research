[project]
name = "aqc"
version = "0.1.0"
description = "air-quality-data-comparison: gridded air-quality products vs monitors"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiohttp>=3.14.5",
    "cdsapi>=0.7.7",
    "cfgrib>=0.9.15.1",
    "earthaccess>=0.19.0",
    "eccodes>=2.50.1",
    "fsspec>=2026.9.0",
    "h5netcdf>=1.8.3",
    "h5py>=3.16.0",
    "icechunk>=2.3.1",
    "matplotlib>=3.11.2",
    "netcdf4>=1.7.5.1.post1",
    "numcodecs[pcodec]>=0.17.1",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pyproj>=3.8.0",
    "rasterio>=1.5.2",
    "requests>=2.34.2",
    "s3fs>=2026.9.0",
    "scipy>=1.18.1",
    "tabulate>=0.10.0",
    "timezonefinder>=9.2.0",
    "xarray>=2026.9.0",
    "zarr>=3.4.2",
]

[project.scripts]
aqc = "aqc.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aqc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
