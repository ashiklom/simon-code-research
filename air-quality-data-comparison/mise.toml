[tools]
python = "3.13"
uv = "0.11"
node = "22"

[env]
ICECHUNK_LOG = "error"
UV_PYTHON_DOWNLOADS = "automatic"

[tasks.sites]
description = "Build site tables (results/sites/*.csv): AQS, IMPROVE/CSN, embassies, SPARTAN, OpenAQ, Sensor.Community, remote points"
run = "uv run aqc sites --networks aqs,speciation,embassy,spartan,openaq,lowcost,remote"

[tasks.obs]
description = "Ingest observations into the store (AQS, AirNow, IMPROVE/CSN, embassies, SPARTAN, OpenAQ, Sensor.Community)"
run = "uv run aqc obs --networks aqs,airnow,speciation,embassy,spartan,openaq,lowcost"

[tasks.extract]
description = "Extract products at sites: mise run extract -- <product...> --sites pilot|tier1|...|all"
run = "uv run aqc extract"

[tasks.cams-store]
description = "Build/resume the global CAMS EAC4 store (2003-2025, 12 variables) that the cams_eac4 site product reads; ADS-bound, days"
run = "uv run aqc cams-store --workers 1"

[tasks.update]
description = "Bring every product up to its latest available time (re-reads only the missing span)"
run = "uv run aqc update --sites all"

[tasks.test]
run = "uv run pytest -q"

[tasks.metrics]
description = "Skill metrics for all sites (data/results/metrics_all.parquet) and the committed summary"
run = [
  "uv run aqc metrics --sites all --workers 6",
  "uv run python scripts/summarize.py",
  "uv run python scripts/key_tables.py",
  "uv run python scripts/lagcheck.py 40",
]

[tasks.figures]
run = "uv run aqc figures"

[tasks.sitedata]
description = "Export per-site website data to site/public/data"
run = "uv run aqc sitedata --sites all"

[tasks.pack-site]
description = "Pack site/public/data into site/site-data.tar (optional; the site reads data from S3 via CloudFront)"
run = "tar -cf site/site-data.tar -C site/public data"

[tasks.publish-site-data]
description = "Upload site/public/data to S3 as a new immutable version and re-pin site/.env.production (asks nothing: run it only after agreeing the upload)"
run = "uv run ../_helpers/publish_s3.py site air-quality-data-comparison site/public/data"

[tasks.site]
description = "Build the static site into _site (data is read from S3/CloudFront at the version pinned in site/.env.production)"
dir = "site"
run = [
  "npm ci --no-audit --no-fund",
  "npx vite build",
]

[tasks.all]
description = "Everything after the one-off site tables: obs, extraction/update, metrics, figures, site data, site"
run = [
  "mise run obs",
  "mise run cams-store",
  "mise run update",
  "mise run metrics",
  "mise run figures",
  "mise run sitedata",
  "mise run site",
]
